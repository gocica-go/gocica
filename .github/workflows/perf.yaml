# Measures gocica against actions/setup-go's cache on a real repository.
#
# Unlike benchmark.yaml this builds gocica from the current ref instead of
# downloading a release, so an unreleased change can be measured.
name: Performance

on:
  workflow_dispatch:
    inputs:
      target-repo:
        description: Repository to build
        required: false
        default: tailscale/tailscale
      target-ref:
        description: Ref of the target repository
        required: false
        default: v1.84.0
      dep-refs:
        description: |
          Refs to walk for the dependency-change scenario, oldest first. Each must
          differ from the last in go.sum, which is what makes actions/setup-go miss:
          its key is the hash of that file and it has no restore keys.
        required: false
        default: v1.86.0,v1.88.0,v1.90.0
      build-cmd:
        description: Build command to measure
        required: false
        default: go build ./cmd/...
      reps:
        description: 'Repetitions per scenario (rep 0 is the cold run): 3 to iterate, 10 to confirm'
        required: false
        default: '3'
      include-nocache:
        description: Also measure with no cache at all. It is a fixed baseline, so it is off while iterating.
        required: false
        type: boolean
        default: false
      profile:
        description: Record gocica's dev metrics (CPU, memory, network at 100ms, per-call latencies) and profiles into the metrics artifacts.
        required: false
        type: boolean
        default: false
      extracted-module-cache:
        description: Run the module proxy with the extracted-module cache on (the binary's default). Off measures the go command extracting every module itself.
        required: false
        type: boolean
        default: true
      sysctl:
        description: 'Kernel settings to apply before anything writes, e.g. "vm.dirty_background_ratio=50 vm.dirty_ratio=80". Empty leaves the runner as is.'
        required: false
        default: ''
      disk:
        description: Where the caches live. "root" is the runner's OS disk, "mnt" its local temporary disk, "tmpfs" a RAM-backed mount.
        required: false
        type: choice
        options: [root, mnt, tmpfs]
        default: root

permissions:
  actions: write
  contents: read

env:
  APP_NAME: gocica
  GO_VERSION: '1.25.3'
  # Defaults repeated here so a dispatch with blank inputs still measures the
  # same thing.
  TARGET_REPO: ${{ github.event.inputs.target-repo || 'tailscale/tailscale' }}
  TARGET_REF: ${{ github.event.inputs.target-ref || 'v1.84.0' }}
  DEP_REFS: ${{ github.event.inputs.dep-refs || 'v1.86.0,v1.88.0' }}
  BUILD_CMD: ${{ github.event.inputs.build-cmd || 'go build ./cmd/...' }}
  REPS: ${{ github.event.inputs.reps || '3' }}
  # Keep the toolchain out of the measurement: a `toolchain` directive would make
  # the go command download ~70 MB through GOPROXY and swamp everything else.
  GOTOOLCHAIN: local
  GOCICA_PROFILE: ${{ github.event.inputs.profile || 'false' }}
  GOCICA_MODULE_PROXY_EXTRACTED_CACHE: ${{ github.event.inputs.extracted-module-cache || 'true' }}
  SYSCTL: ${{ github.event.inputs.sysctl || '' }}
  DISK: ${{ github.event.inputs.disk || 'root' }}
  # On the temporary disk every cache moves together: setup-go restores into
  # GOMODCACHE and GOCACHE wherever they point, and gocica's store has to share a
  # filesystem with GOMODCACHE.
  CACHE_ROOT: ${{ (github.event.inputs.disk == 'mnt' && '/mnt') || (github.event.inputs.disk == 'tmpfs' && '/home/runner/ramdisk') || '' }}
  GOMODCACHE: ${{ (github.event.inputs.disk == 'mnt' && '/mnt/go/pkg/mod') || (github.event.inputs.disk == 'tmpfs' && '/home/runner/ramdisk/go/pkg/mod') || '' }}
  GOCACHE: ${{ (github.event.inputs.disk == 'mnt' && '/mnt/go-build') || (github.event.inputs.disk == 'tmpfs' && '/home/runner/ramdisk/go-build') || '' }}
  GOCICA_DIR: ${{ (github.event.inputs.disk == 'mnt' && '/mnt/gocica') || (github.event.inputs.disk == 'tmpfs' && '/home/runner/ramdisk/gocica') || '' }}

jobs:
  build:
    name: Build gocica
    runs-on: ubuntu-latest
    outputs:
      reps: ${{ steps.matrix.outputs.reps }}
      dep-matrix: ${{ steps.matrix.outputs.dep-matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -tags=dev -o ${{ env.APP_NAME }} .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}
          path: ./${{ env.APP_NAME }}
      - id: matrix
        name: Build the repetition matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          reps = int(os.environ["REPS"])
          print("reps=" + json.dumps(list(range(reps))))
          # Each dependency-change repetition walks to the next ref. Repeating one
          # ref would measure nothing: setup-go saves a cache under the new go.sum
          # on its first try, so only the first encounter is a miss.
          #
          # Numbering from 1 keeps the aggregator from labelling the first one cold.
          refs = [r.strip() for r in os.environ["DEP_REFS"].split(",") if r.strip()]
          print("dep-matrix=" + json.dumps([{"rep": i + 1, "ref": r} for i, r in enumerate(refs)]))
          PY
        env:
          REPS: ${{ env.REPS }}
          DEP_REFS: ${{ env.DEP_REFS }}

  # Scenarios run one after another, and one repetition at a time, so that each
  # job sees a deterministic cache state: rep 0 is cold, the rest are warm.
  gocica:
    name: measure (gocica, ${{ matrix.rep }})
    needs: [build]
    runs-on: ubuntu-latest
    env:
      SCENARIO: gocica
      REP: ${{ matrix.rep }}
      # Shared by the Start and Measure steps. env.APP_NAME cannot be read here.
      GOCICA_BIN: ${{ github.workspace }}/gocica
      USE_GOCICA: '1'
      CGO_ENABLED: '0'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        rep: ${{ fromJSON(needs.build.outputs.reps) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: gocica-src
      - name: Clear the gocica cache entries
        if: matrix.rep == 0
        uses: actions/github-script@v8
        with:
          script: |
            const script = require('./gocica-src/.github/scripts/clear-caches.js')
            await script({ github, context, prefixes: ['gocica-cache-', 'gocica-mod-'] })
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: target
      - name: Prepare the runner
        run: |
          if [ -n "$SYSCTL" ]; then
            # shellcheck disable=SC2086
            sudo sysctl -w $SYSCTL
          fi
          if [ "$DISK" = tmpfs ]; then
            sudo mkdir -p "$CACHE_ROOT"
            # Sized as a ceiling, not a reservation: tmpfs only takes what is written.
            sudo mount -t tmpfs -o size=10g tmpfs "$CACHE_ROOT"
          fi
          if [ -n "$CACHE_ROOT" ]; then
            sudo mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOCICA_DIR"
            sudo chown -R "$(id -u):$(id -g)" "$CACHE_ROOT"
          fi
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}
      # ref: https://github.com/actions/download-artifact#permission-loss
      - name: Fix permissions
        run: chmod +x ${{ env.APP_NAME }}
      # Before the daemon starts: it needs the cache API token from here.
      - name: Expose GitHub Actions runtime environment variables
        uses: crazy-max/ghaction-github-runtime@v4
      # Before setup-go, so the warm-up overlaps the toolchain download. The
      # step only launches the daemon; the Measure step waits for readiness and
      # records what was left of the warm-up as proxy_ready.
      - name: Start gocica
        working-directory: target
        run: bash "$GITHUB_WORKSPACE/gocica-src/.github/scripts/measure.sh" start
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          # gocica replaces this cache entirely. That is the whole point.
          cache: false
      - name: Measure
        working-directory: target
        run: bash "$GITHUB_WORKSPACE/gocica-src/.github/scripts/measure.sh"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metrics-gocica-${{ matrix.rep }}
          path: metrics

  setupgo:
    name: measure (setupgo, ${{ matrix.rep }})
    needs: [build, gocica_buildonly]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        rep: ${{ fromJSON(needs.build.outputs.reps) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: gocica-src
      - name: Clear the setup-go cache entries
        if: matrix.rep == 0
        uses: actions/github-script@v8
        with:
          script: |
            const script = require('./gocica-src/.github/scripts/clear-caches.js')
            await script({ github, context, prefixes: ['setup-go-'] })
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: target
      - name: Prepare the runner
        run: |
          if [ -n "$SYSCTL" ]; then
            # shellcheck disable=SC2086
            sudo sysctl -w $SYSCTL
          fi
          if [ "$DISK" = tmpfs ]; then
            sudo mkdir -p "$CACHE_ROOT"
            # Sized as a ceiling, not a reservation: tmpfs only takes what is written.
            sudo mount -t tmpfs -o size=10g tmpfs "$CACHE_ROOT"
          fi
          if [ -n "$CACHE_ROOT" ]; then
            sudo mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOCICA_DIR"
            sudo chown -R "$(id -u):$(id -g)" "$CACHE_ROOT"
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: target/go.sum
      - name: Measure
        working-directory: target
        run: bash "$GITHUB_WORKSPACE/gocica-src/.github/scripts/measure.sh"
        env:
          SCENARIO: setupgo
          REP: ${{ matrix.rep }}
          BUILD_CMD: ${{ env.BUILD_CMD }}
          CGO_ENABLED: '0'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metrics-setupgo-${{ matrix.rep }}
          path: metrics

  # Same caches again, one step fewer. `go mod download` fetches a module's zip
  # whether or not the module is already extracted, so a workflow that only
  # builds skips the transfer entirely and uses the restored trees directly.
  # Plenty of real workflows are shaped that way.
  gocica_buildonly:
    name: measure (gocica-buildonly, ${{ matrix.rep }})
    needs: [build, gocica]
    runs-on: ubuntu-latest
    env:
      SCENARIO: gocica-buildonly
      REP: ${{ matrix.rep }}
      # Shared by the Start and Measure steps. env.APP_NAME cannot be read here.
      GOCICA_BIN: ${{ github.workspace }}/gocica
      USE_GOCICA: '1'
      BUILD_ONLY: '1'
      CGO_ENABLED: '0'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          path: gocica-src
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: target
      - name: Prepare the runner
        run: |
          if [ -n "$SYSCTL" ]; then
            # shellcheck disable=SC2086
            sudo sysctl -w $SYSCTL
          fi
          if [ "$DISK" = tmpfs ]; then
            sudo mkdir -p "$CACHE_ROOT"
            # Sized as a ceiling, not a reservation: tmpfs only takes what is written.
            sudo mount -t tmpfs -o size=10g tmpfs "$CACHE_ROOT"
          fi
          if [ -n "$CACHE_ROOT" ]; then
            sudo mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOCICA_DIR"
            sudo chown -R "$(id -u):$(id -g)" "$CACHE_ROOT"
          fi
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}
      # ref: https://github.com/actions/download-artifact#permission-loss
      - name: Fix permissions
        run: chmod +x ${{ env.APP_NAME }}
      # Before the daemon starts: it needs the cache API token from here.
      - name: Expose GitHub Actions runtime environment variables
        uses: crazy-max/ghaction-github-runtime@v4
      # Before setup-go, so the warm-up overlaps the toolchain download. The
      # step only launches the daemon; the Measure step waits for readiness and
      # records what was left of the warm-up as proxy_ready.
      - name: Start gocica
        working-directory: target
        run: bash "$GITHUB_WORKSPACE/gocica-src/.github/scripts/measure.sh" start
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Measure
        working-directory: target
        run: bash "$GITHUB_WORKSPACE/gocica-src/.github/scripts/measure.sh"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metrics-gocica-buildonly-${{ matrix.rep }}
          path: metrics

  setupgo_buildonly:
    name: measure (setupgo-buildonly, ${{ matrix.rep }})
    needs: [build, setupgo]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          path: gocica-src
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: target
      - name: Prepare the runner
        run: |
          if [ -n "$SYSCTL" ]; then
            # shellcheck disable=SC2086
            sudo sysctl -w $SYSCTL
          fi
          if [ "$DISK" = tmpfs ]; then
            sudo mkdir -p "$CACHE_ROOT"
            # Sized as a ceiling, not a reservation: tmpfs only takes what is written.
            sudo mount -t tmpfs -o size=10g tmpfs "$CACHE_ROOT"
          fi
          if [ -n "$CACHE_ROOT" ]; then
            sudo mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOCICA_DIR"
            sudo chown -R "$(id -u):$(id -g)" "$CACHE_ROOT"
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: target/go.sum
      - name: Measure
        working-directory: target
        run: bash "$GITHUB_WORKSPACE/gocica-src/.github/scripts/measure.sh"
        env:
          SCENARIO: setupgo-buildonly
          REP: ${{ matrix.rep }}
          BUILD_CMD: ${{ env.BUILD_CMD }}
          BUILD_ONLY: '1'
          CGO_ENABLED: '0'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metrics-setupgo-buildonly-${{ matrix.rep }}
          path: metrics

  # The warm scenarios above measure the best case for actions/setup-go: every
  # repetition sees a byte-identical go.sum. Its cache key is the hash of that
  # file and it has no restore keys, so any dependency change is a total miss.
  # gocica's restore key chain still matches the previous blob, and only the
  # modules that actually changed come from upstream. That is the ordinary case
  # in a repository anyone is working on, and it is what these two measure.
  gocica_depchange:
    name: measure (gocica-dep, ${{ matrix.entry.rep }})
    needs: [build, setupgo_buildonly]
    runs-on: ubuntu-latest
    env:
      SCENARIO: gocica-dep
      REP: ${{ matrix.entry.rep }}
      # Shared by the Start and Measure steps. env.APP_NAME cannot be read here.
      GOCICA_BIN: ${{ github.workspace }}/gocica
      USE_GOCICA: '1'
      CGO_ENABLED: '0'
      # Every repetition is a different commit as far as the cache is
      # concerned, so gocica publishes its result the way it would in a real
      # repository. Without this they all share the workflow's SHA, the
      # second one onwards is refused with a 409, and gocica never pays the
      # upload that setup-go pays on every key change.
      GOCICA_GITHUB_SHA: ${{ github.sha }}-${{ matrix.entry.ref }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.build.outputs.dep-matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: gocica-src
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ matrix.entry.ref }}
          path: target
      - name: Prepare the runner
        run: |
          if [ -n "$SYSCTL" ]; then
            # shellcheck disable=SC2086
            sudo sysctl -w $SYSCTL
          fi
          if [ "$DISK" = tmpfs ]; then
            sudo mkdir -p "$CACHE_ROOT"
            # Sized as a ceiling, not a reservation: tmpfs only takes what is written.
            sudo mount -t tmpfs -o size=10g tmpfs "$CACHE_ROOT"
          fi
          if [ -n "$CACHE_ROOT" ]; then
            sudo mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOCICA_DIR"
            sudo chown -R "$(id -u):$(id -g)" "$CACHE_ROOT"
          fi
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}
      # ref: https://github.com/actions/download-artifact#permission-loss
      - name: Fix permissions
        run: chmod +x ${{ env.APP_NAME }}
      # Before the daemon starts: it needs the cache API token from here.
      - name: Expose GitHub Actions runtime environment variables
        uses: crazy-max/ghaction-github-runtime@v4
      # Before setup-go, so the warm-up overlaps the toolchain download. The
      # step only launches the daemon; the Measure step waits for readiness and
      # records what was left of the warm-up as proxy_ready.
      - name: Start gocica
        working-directory: target
        run: bash "$GITHUB_WORKSPACE/gocica-src/.github/scripts/measure.sh" start
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Measure
        working-directory: target
        run: bash "$GITHUB_WORKSPACE/gocica-src/.github/scripts/measure.sh"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metrics-gocica-dep-${{ matrix.entry.rep }}
          path: metrics

  setupgo_depchange:
    name: measure (setupgo-dep, ${{ matrix.entry.rep }})
    needs: [build, gocica_depchange]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.build.outputs.dep-matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: gocica-src
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ matrix.entry.ref }}
          path: target
      - name: Prepare the runner
        run: |
          if [ -n "$SYSCTL" ]; then
            # shellcheck disable=SC2086
            sudo sysctl -w $SYSCTL
          fi
          if [ "$DISK" = tmpfs ]; then
            sudo mkdir -p "$CACHE_ROOT"
            # Sized as a ceiling, not a reservation: tmpfs only takes what is written.
            sudo mount -t tmpfs -o size=10g tmpfs "$CACHE_ROOT"
          fi
          if [ -n "$CACHE_ROOT" ]; then
            sudo mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOCICA_DIR"
            sudo chown -R "$(id -u):$(id -g)" "$CACHE_ROOT"
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: target/go.sum
      - name: Measure
        working-directory: target
        run: bash "$GITHUB_WORKSPACE/gocica-src/.github/scripts/measure.sh"
        env:
          SCENARIO: setupgo-dep
          REP: ${{ matrix.entry.rep }}
          BUILD_CMD: ${{ env.BUILD_CMD }}
          CGO_ENABLED: '0'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metrics-setupgo-dep-${{ matrix.entry.rep }}
          path: metrics

  nocache:
    name: measure (nocache, ${{ matrix.rep }})
    needs: [build, setupgo_depchange]
    if: ${{ github.event.inputs.include-nocache == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        rep: ${{ fromJSON(needs.build.outputs.reps) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: gocica-src
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: target
      - name: Prepare the runner
        run: |
          if [ -n "$SYSCTL" ]; then
            # shellcheck disable=SC2086
            sudo sysctl -w $SYSCTL
          fi
          if [ "$DISK" = tmpfs ]; then
            sudo mkdir -p "$CACHE_ROOT"
            # Sized as a ceiling, not a reservation: tmpfs only takes what is written.
            sudo mount -t tmpfs -o size=10g tmpfs "$CACHE_ROOT"
          fi
          if [ -n "$CACHE_ROOT" ]; then
            sudo mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOCICA_DIR"
            sudo chown -R "$(id -u):$(id -g)" "$CACHE_ROOT"
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Measure
        working-directory: target
        run: bash "$GITHUB_WORKSPACE/gocica-src/.github/scripts/measure.sh"
        env:
          SCENARIO: nocache
          REP: ${{ matrix.rep }}
          BUILD_CMD: ${{ env.BUILD_CMD }}
          CGO_ENABLED: '0'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metrics-nocache-${{ matrix.rep }}
          path: metrics

  report:
    name: Report
    needs: [gocica, gocica_buildonly, setupgo, setupgo_buildonly, gocica_depchange, setupgo_depchange, nocache]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: metrics-*
          path: metrics
      - name: Collect job wall times
        run: gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > jobs.json
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Aggregate
        run: go tool bench -metrics metrics -jobs jobs.json | tee -a "$GITHUB_STEP_SUMMARY"
