name: CI

on:
  push:
    branches:
      - "main"
  pull_request:

env:
  APP_NAME: gocica

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      GOCACHE: "/tmp/go/cache"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@v6
        with:
          path: /tmp/go/cache
          key: ${{ runner.os }}-go-build-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ github.ref }}-
            ${{ runner.os }}-go-build-
      - run: go build -tags=dev -o ${{ env.APP_NAME }} .
      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}
          path: ./${{ env.APP_NAME }}
  std_lib_build:
    name: Build standard library
    needs: [build]
    runs-on: ubuntu-latest
    env:
      GOMODCACHE: /tmp/gocache/mod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go clean -cache
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}
      - name: Fix permissions # ref: https://github.com/actions/download-artifact?tab=readme-ov-file#permission-loss
        run: chmod +x ${{ env.APP_NAME }}
      - name: Expose GitHub Actions runtime environment variables
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Build standard library
        run: time go install std
        env:
          GOCACHEPROG: "./${{ env.APP_NAME }}"
  traq_build:
    name: Build traQ
    needs: [build]
    runs-on: ubuntu-latest
    env:
      GOMODCACHE: /tmp/gocache/mod
    steps:
      - uses: actions/checkout@v7
        with:
          repository: traPtitech/traQ
          ref: v3.22.0
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.24.1
      - run: go clean -cache
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}
      - name: Fix permissions # ref: https://github.com/actions/download-artifact?tab=readme-ov-file#permission-loss
        run: chmod +x ./${{ env.APP_NAME }}
      - name: Expose GitHub Actions runtime environment variables
        uses: crazy-max/ghaction-github-runtime@v4
      - run: mkdir ./tmp
      - run: time go build -o traQ -ldflags "-s -w -X main.version=Dev -X main.revision=Local"
        env:
          CGO_ENABLED: 0
          GOCACHEPROG: "./${{ env.APP_NAME }} --dev.cpu-prof=./tmp/cpu.prof --dev.fg-prof=./tmp/fgprof.prof --dev.mem-prof=./tmp/mem.prof --dev.metrics=./tmp/metrics.csv --dev.mutex-prof=./tmp/mutex.prof --dev.block-prof=./tmp/block.prof"
      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: metrics
          path: ./tmp
  traq_module_proxy:
    name: Build traQ (module proxy)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: traPtitech/traQ
          ref: v3.22.0
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.1
          # The point of this job: GoCICa serves the module cache too, so
          # setup-go's has to be unnecessary.
          cache: false
      - run: go clean -cache -modcache
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}
      - name: Fix permissions # ref: https://github.com/actions/download-artifact?tab=readme-ov-file#permission-loss
        run: chmod +x ./${{ env.APP_NAME }}
      - name: Expose GitHub Actions runtime environment variables
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Start the module proxy
        run: |
          set -euo pipefail
          mkdir -p ./tmp
          nohup ./${{ env.APP_NAME }} serve --dir=/tmp/gocica --export-github-env \
            > ./tmp/proxy.log 2>&1 &
          for _ in $(seq 1 3000); do
            url=$(python3 -c "import json,sys;print(json.load(open('/tmp/gocica/mod/proxy.json'))['url'])" 2>/dev/null) || { sleep 0.1; continue; }
            # Readiness, not liveness: the daemon is still restoring modules.
            if curl -fsS "$url/-/healthz" | grep -q '"ready":true'; then
              exit 0
            fi
            sleep 0.1
          done
          # Failing here is the point: if the proxy never comes up the build would
          # quietly fall back to proxy.golang.org and this job would prove nothing.
          echo "module proxy never became healthy" >&2
          cat ./tmp/proxy.log >&2
          exit 1
      - run: go mod download
      - run: time go build -o traQ -ldflags "-s -w -X main.version=Dev -X main.revision=Local"
        env:
          CGO_ENABLED: 0
          GOCACHEPROG: './${{ env.APP_NAME }} --dir=/tmp/gocica'
      - name: Flush the module cache
        if: always()
        run: ./${{ env.APP_NAME }} proxy-stop --dir=/tmp/gocica
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: module-proxy-log
          path: ./tmp/proxy.log
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -v -coverprofile=./coverage.txt -race -vet=off
      - name: Upload coverage data
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage.txt
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage.txt
          path: coverage.txt
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - run: go tool lint ./... ./tools/...
